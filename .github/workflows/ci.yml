name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  swift-tests:
    name: SwiftPM Tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

  landing-build:
    name: Landing Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build landing page
        run: npm run build
